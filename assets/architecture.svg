<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc">
<title id="title">Answer Checking API architecture</title><desc id="desc">A client sends a question and answer to FastAPI. Python calls Ollama twice: first for a search query and then for evidence-based evaluation. MediaWiki returns up to five documents, shortened to 500 characters each. Python maps source IDs to URLs and returns structured JSON.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#172b42}.h{font-size:22px;font-weight:700}.b{font-size:16px;font-weight:650}.s{font-size:13px;fill:#475569}.k{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#64748b}.line{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.box{fill:white;stroke:#cbd5e1;stroke-width:1.3}.wm{font-size:13px;fill:#64748b;opacity:.72}.wm2{font-size:11px;fill:#94a3b8;opacity:.65}</style></defs>
<rect width="1120" height="750" rx="20" fill="#f8fafc"/>
<text x="40" y="47" font-size="30" font-weight="750">Answer Checking API</text><text x="40" y="73" class="s">Evidence-based answer verification · Architecture v0.1.0</text>
<rect x="28" y="105" width="1064" height="571" rx="16" fill="#fff" stroke="#cbd5e1"/>
<text x="48" y="129" class="k">CLIENT</text><text x="48" y="146" class="s">사용자 / Swagger UI</text>
<rect x="48" y="158" width="218" height="93" rx="10" fill="#eff6ff" stroke="#93b5ef"/>
<text x="64" y="184" class="b">Question + Answer</text><text x="64" y="207" class="s">질문과 검증 대상 답변</text><text x="64" y="229" class="s">POST /check · JSON</text>
<rect x="48" y="510" width="218" height="116" rx="10" fill="#ecfdf5" stroke="#86bfa9"/>
<text x="64" y="537" class="b">Verification result</text><text x="64" y="560" class="s">정확성 · 맥락 · 판단 근거</text><text x="64" y="581" class="s">accuracy / relevance</text><text x="64" y="602" class="s">reason / sources</text>
<rect x="304" y="129" width="478" height="528" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="322" y="151" class="k">LOCAL APPLICATION · PYTHON</text>
<rect x="324" y="164" width="438" height="73" rx="9" class="box"/>
<text x="340" y="188" class="b">FastAPI · main.py</text><text x="340" y="210" class="s">POST /check → CheckRequest (Pydantic)</text><text x="746" y="188" text-anchor="end" class="s">:8000</text>
<rect x="324" y="254" width="438" height="390" rx="10" fill="#ffffff" stroke="#94a3b8"/>
<text x="340" y="277" class="b">checker.py · check_answer()</text>
<rect x="344" y="294" width="398" height="63" rx="7" fill="#eff6ff" stroke="#9bbbe9"/>
<text x="358" y="318" class="b">01  Generate search query</text><text x="358" y="340" class="s">질문·답변 → SearchQuery JSON</text>
<rect x="344" y="375" width="398" height="63" rx="7" fill="#fef3e8" stroke="#e5b783"/>
<text x="358" y="399" class="b">02  Retrieve evidence · search.py</text><text x="358" y="421" class="s">최대 5개 문서 · 문서별 500자 제한</text>
<rect x="344" y="456" width="398" height="63" rx="7" fill="#eff6ff" stroke="#9bbbe9"/>
<text x="358" y="480" class="b">03  Evaluate answer</text><text x="358" y="502" class="s">질문·답변·검색 자료 → ModelEvaluation</text>
<rect x="344" y="537" width="398" height="87" rx="7" fill="#ecfdf5" stroke="#86bfa9"/>
<text x="358" y="561" class="b">04  Map sources &amp; return</text><text x="358" y="583" class="s">문서 ID → 실제 제목과 URL</text><text x="358" y="603" class="s">출처 없음 → unverifiable · CheckResponse</text>
<path d="M266 200 H324" class="line"/><path d="M543 237 V254" class="line"/><path d="M543 357 V375" class="line"/><path d="M543 438 V456" class="line"/><path d="M543 519 V537" class="line"/><path d="M344 581 H284 V568 H266" class="line"/>
<text x="802" y="151" class="k">DEPENDENCIES</text>
<rect x="802" y="164" width="270" height="94" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="818" y="188" class="b">Runtime configuration</text><text x="818" y="211" class="s">.env · OLLAMA_URL / OLLAMA_MODEL</text><text x="818" y="233" class="s">기본 모델: Qwen2.5 3B</text>
<rect x="802" y="294" width="270" height="63" rx="8" fill="#eaf2ff" stroke="#9bbbe9"/>
<text x="818" y="318" class="b">Ollama · call 1</text><text x="818" y="340" class="s">:11434 /api/chat · 검색어 생성</text>
<rect x="802" y="375" width="270" height="63" rx="8" fill="#fff4e8" stroke="#e5b783"/>
<text x="818" y="399" class="b">MediaWiki Action API</text><text x="818" y="421" class="s">GET · ko.wikipedia.org/w/api.php</text>
<rect x="802" y="456" width="270" height="63" rx="8" fill="#eaf2ff" stroke="#9bbbe9"/>
<text x="818" y="480" class="b">Ollama · call 2</text><text x="818" y="502" class="s">같은 모델 서버 · JSON Schema 평가</text>
<path d="M742 318 H802" class="line"/><path d="M802 341 H742" class="line"/>
<path d="M742 399 H802" class="line"/><path d="M802 422 H742" class="line"/>
<path d="M742 480 H802" class="line"/><path d="M802 503 H742" class="line"/>
<rect x="802" y="537" width="270" height="87" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="818" y="561" class="b">Failure handling</text><text x="818" y="583" class="s">422: 잘못된 입력 · 502: 처리 오류</text><text x="818" y="603" class="s">200: 검증 결과 (정확성 보장 아님)</text>
<line x1="40" y1="696" x2="1080" y2="696" stroke="#cbd5e1"/><text x="40" y="719" class="s">Local: FastAPI + Ollama · External: generated query → Wikipedia</text><text x="1080" y="719" text-anchor="end" class="s">Human review required · 검증 보조 도구</text>

