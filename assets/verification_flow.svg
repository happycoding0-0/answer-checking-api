<rect x="37" y="1658" width="434" height="120" rx="26" fill="#002d5b" stroke="#244b6f" stroke-width="1.4"/>
<text x="254.0" y="1725.7" text-anchor="middle" font-size="22" font-weight="700" fill="#a6d2ff">비판적 사고 및 최종 판단</text>
<line x1="254.0" y1="1778" x2="254.0" y2="1836" stroke="#8f959c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="67" y="1854" width="374" height="108" rx="26" fill="#002d5b" stroke="#244b6f" stroke-width="1.4"/>
<text x="254.0" y="1915.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a6d2ff">책임감 있는 AI 활용</text>
<text x="472" y="1988" text-anchor="end" class="wm">Lee jee woo</text>
