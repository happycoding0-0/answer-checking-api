<text x="254.0" y="747.4" text-anchor="middle" font-size="24" font-weight="700" fill="#a6d2ff">검증 검색어 생성</text>
<line x1="254.0" y1="797" x2="254.0" y2="845" stroke="#8f959c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="97" y="863" width="314" height="116" rx="26" fill="#002d5b" stroke="#244b6f" stroke-width="1.4"/>
<text x="254.0" y="929.4" text-anchor="middle" font-size="24" font-weight="700" fill="#a6d2ff">외부 근거 검색</text>
